name: PR Testing

# Runs on every pull request against dev. Jobs:
#   1. contracts-test    — smart contract tests (contracts/).
#   2. docs-build        — Docusaurus site builds (docs/).
#   3. dx-check          — Dioxus compile checks (web/ios/android/tauri-web).
#   4. ratel-app         — x86 docker image artifact, RETAINED ONLY for the
#                          tauri-android-smoke-test job (its emulator backend
#                          must run on the ubuntu-latest host's docker). The
#                          browser e2e path no longer consumes it.
#   5. ratel-app-testing — server function integration tests (cargo test).
#   6. build-image       — SELF-HOSTED (biyard org k8s runner pods, arm64):
#                          native `make build-testing` (both cluster nodes are
#                          arm64 — no cross-compile), then package + push the
#                          app image with the IN-CLUSTER buildkitd
#                          (scripts/buildkit-image.sh — the runners carry
#                          buildctl, no docker CLI) to the in-cluster registry
#                          as ratel-app-shell:pr-<num>.
#   7. e2e               — PR-ISOLATED Playwright run on the HOME k3s cluster
#                          (modeled on asset's e2e job): deploy the full
#                          preview stack (localstack + init seed job + qdrant
#                          + app-shell + Ingress) from deploy/pr-preview/*.yaml
#                          into namespace ratel-pr-<num>, reachable at
#                          ratel-<num>.pr.biyard.co (exact-host Ingress takes
#                          the name over from the wildcard pr-nginx; default
#                          TLS cert — Playwright ignores TLS errors). The
#                          suite runs in a k8s pod (official Playwright image,
#                          kubectl cp in/out), pinned to the ingress ClusterIP
#                          via E2E_HOST_RESOLVER_RULES. The HTML report is
#                          published to the pr-webroot at
#                          ratel-report-<num>.pr.biyard.co and linked from a
#                          sticky PR comment. UNLIKE asset, the preview
#                          namespace is TORN DOWN when the tests finish (the
#                          report webroot stays); pr-preview-cleanup.yml is
#                          only the safety net for cancelled/crashed runs.
#                          NON-BLOCKING (`continue-on-error: true`) while the
#                          new infra path stabilizes — promote to a required
#                          check once a run of green history backs it.
#   8. tauri-android-*   — Android APK build + emulator smoke test (docker
#                          compose backend from job 4).
#
# Caching on the self-hosted jobs is restore-only (actions/cache/restore,
# never save) with ratel-cargo-* / ratel-target-* keys — same policy as
# asset's pr-workflow: PR runs restore warmed caches but never write their
# own entries, keeping the repo cache store from filling per-PR.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev]

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          npm ci

      - name: Run contract tests
        run: |
          make test

  docs-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site (en + ko)
        env:
          ENV: dev
        run: npm run build

  dx-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/ratel

    steps:
      - uses: actions/checkout@v6

      - name: Restore cache
        id: dx-check-cache
        uses: actions/cache/restore@v5
        with:
          key: app-shell-build-${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            app-shell-build-${{ runner.os }}-rust-
          path: |
            ~/.cargo/bin
            target

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          toolchain: stable
          target: wasm32-unknown-unknown
          cache: false

      - uses: cargo-bins/cargo-binstall@main
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lld

      - name: Install Dioxus-cli
        run: |
          # `--locked` makes the `cargo install` fallback (when binstall
          # can't find a prebuilt binary) honor dioxus-cli's published
          # Cargo.lock. Without it, fresh transitive resolution picks up
          # `git2 0.21`, which breaks `auth-git2 0.5.8`'s
          # `Cred::credential_helper` call → dioxus-cli build fails.
          cargo binstall dioxus-cli --force --locked

      - name: Building test
        id: build
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          dx check --web
          dx check --ios
          dx check --android

      # The `asset!("/assets/tailwind.css")` macro in app.rs checks the
      # file exists at compile time. `dx check --web` above runs through
      # the manganis asset resolver which auto-creates placeholders, but
      # plain `cargo check` doesn't. Touch a placeholder so the macro
      # passes — contents don't matter for compile-time checks.
      - name: Ensure tailwind.css placeholder
        run: touch assets/tailwind.css

      - name: cargo check --features tauri-web
        env:
          RUSTFLAGS: "-D warnings"
          DYNAMO_TABLE_PREFIX: ratel-dev
        run: |
          cargo check --features tauri-web --no-default-features

      - name: dx check --web --features tauri-web
        env:
          RUSTFLAGS: "-D warnings"
          DYNAMO_TABLE_PREFIX: ratel-dev
        run: |
          dx check --web --features tauri-web --no-default-features

      - name: cargo check app/ratel-tauri shell crate
        working-directory: app/ratel-tauri/src-tauri
        env:
          DYNAMO_TABLE_PREFIX: ratel-dev
          # commands/google_sign_in.rs uses
          #   option_env!("GOOGLE_OAUTH_CLIENT_ID").expect(...)
          # which panics at compile time if the env var is unset. Any
          # non-empty value lets the compile pass; runtime Google sign-in
          # is exercised by the dev workflow's APK build with the real
          # GOOGLE_OAUTH_CLIENT_ID_DEV secret.
          GOOGLE_OAUTH_CLIENT_ID: placeholder-for-compile-only
        run: |
          cargo check

  # ────────────────────────────────────────────────────────────────────────
  # ratel-app: x86_64 docker image artifact. RETAINED ONLY as the backend
  # provider for `tauri-android-smoke-test` — that job loads this artifact
  # into the ubuntu-latest host's docker daemon and reaches it from the
  # Android emulator via `adb reverse`, which the in-cluster arm64 image
  # (build-image job) cannot serve. The browser e2e path (e2e job) no longer
  # consumes this artifact. If the smoke test ever moves off docker compose,
  # delete this job.
  # ────────────────────────────────────────────────────────────────────────
  ratel-app:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        # Cold cache (Cargo.lock changed) makes this dx build fill the runner
        # disk alongside the restored cache; drop unused preinstalled
        # toolchains first (same mitigation as ratel-app-testing).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h / /mnt

      - name: Add swap memory
        # The job died with "runner lost communication" ~80 min into a cold
        # `make build-testing` — the classic OOM kill on the 7 GB runner. Same
        # 12G /mnt swap ratel-app-testing uses.
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Restore cache
        id: app-shell-build-cache
        uses: actions/cache/restore@v5
        with:
          key: app-shell-build-${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            app-shell-build-${{ runner.os }}-rust-
          path: |
            ~/.cargo/bin
            target

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          toolchain: stable
          target: wasm32-unknown-unknown
          cache: false

      - uses: cargo-bins/cargo-binstall@main
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lld

      - name: Install Dioxus-cli
        run: |
          # `--locked` makes the `cargo install` fallback (when binstall
          # can't find a prebuilt binary) honor dioxus-cli's published
          # Cargo.lock. Without it, fresh transitive resolution picks up
          # `git2 0.21`, which breaks `auth-git2 0.5.8`'s
          # `Cred::credential_helper` call → dioxus-cli build fails.
          cargo binstall dioxus-cli --force --locked

      - name: Building test
        id: build
        env:
          DYNAMO_TABLE_PREFIX: ratel-local
          ENV: local
          RUSTFLAGS: "-D warnings"
          RUST_LOG: error
          DYNAMO_ENDPOINT: http://localstack:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-northeast-2
          AWS_ACCOUNT_ID: test
          COMMIT: pr-${{ github.sha }}
          ECR: ratel/app-shell
          # Bound rustc parallelism on cold builds — 4 concurrent rustc peaks
          # past the 7 GB runner even with swap (see "Add swap memory" above).
          CARGO_BUILD_JOBS: "2"
        run: |
          npm i
          rm -rf target/dx

          cd app/ratel
          make build-testing
          make docker

          # Save image for artifact upload
          docker save $ECR:$COMMIT | gzip > /tmp/app-shell-image.tar.gz
          echo "image=$ECR:$COMMIT" >> $GITHUB_OUTPUT

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-shell-image-${{ github.sha }}
          path: /tmp/app-shell-image.tar.gz
          retention-days: 7

  ratel-app-testing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Cold-cache compile of `cargo test --features server,bypass --tests`
      # peaks above the ubuntu-latest 7 GB RAM budget and OOM-kills the
      # runner agent (manifests as exit 143 / "runner shutdown signal"
      # during the link phase). Replace the runner's default 4 GB swap
      # with 12 GB on /mnt (the larger data disk) to absorb the spike.
      - name: Free disk space
        # The job died with "No space left on device" on /home/runner while
        # restoring the multi-GB cargo/target cache (observed on run
        # 30881118844 and the run before it). ubuntu-latest ships ~25 GB of
        # preinstalled toolchains this job never uses — drop them so the
        # cache extraction + cold build fit.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h / /mnt

      - name: Add swap memory
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Restore cache
        id: app-shell-build-cache
        uses: actions/cache/restore@v5
        with:
          key: app-shell-build-${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            app-shell-build-${{ runner.os }}-rust-
          path: |
            ~/.cargo/bin
            target

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          toolchain: stable
          target: wasm32-unknown-unknown
          cache: false

      - uses: cargo-bins/cargo-binstall@main
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lld

      - name: Install Dioxus-cli
        run: |
          # `--locked` makes the `cargo install` fallback (when binstall
          # can't find a prebuilt binary) honor dioxus-cli's published
          # Cargo.lock. Without it, fresh transitive resolution picks up
          # `git2 0.21`, which breaks `auth-git2 0.5.8`'s
          # `Cred::credential_helper` call → dioxus-cli build fails.
          cargo binstall dioxus-cli --force --locked

      - name: Start infrastructure
        run: |
          docker compose --profile infra up -d localstack qdrant
          echo "Waiting for LocalStack to be healthy..."
          timeout 120 bash -c 'until curl -sf http://localhost:4566/_localstack/health > /dev/null 2>&1; do sleep 5; done'
          echo "LocalStack is healthy, starting remaining services..."
          docker compose --profile infra up -d --remove-orphans

      - name: Run tests
        working-directory: app/ratel
        env:
          DYNAMO_TABLE_PREFIX: ratel-local
          DYNAMO_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-northeast-2
          AWS_ACCOUNT_ID: test
          RUST_LOG: info
          ENV: local
          # ubuntu-latest has 7 GB RAM and 4 vCPUs. The full server+bypass
          # compile peaks above the runner budget and OOM-kills the runner
          # agent during the link phase (exit 143 / "runner shutdown
          # signal"). Combined with the 10 GB swap added at job start,
          # cap parallelism at 1 to keep peak RSS well under budget. The
          # cost is ~1.5-2x compile wall time on cold cache; warm cache
          # is unaffected.
          CARGO_BUILD_JOBS: "1"
        run: |
          npm i
          make test

  # ────────────────────────────────────────────────────────────────────────
  # build-image: build the arm64 app-shell image ON the self-hosted runner
  # and push it to the in-cluster registry as ratel-app-shell:pr-<num>.
  #
  # The runners are biyard org-level k8s pods on the home k3s cluster
  # (kubectl + helm + buildctl preinstalled, BUILDKIT_HOST preset, NO docker
  # CLI). Both cluster nodes are arm64, so a native `make build-testing`
  # here already produces arm64 binaries — the buildkit step only packages
  # the dx output (app/ratel/Dockerfile copies target/dx/app-shell/release/
  # web) and pushes; no compile happens inside the Dockerfile.
  #
  # The compile-time env block is IDENTICAL to the ratel-app job above —
  # DYNAMO_ENDPOINT=http://localstack:4566 etc. are baked into the binary,
  # and stay valid in-cluster because deploy/pr-preview names its k8s
  # Services after the docker-compose hostnames (localstack, qdrant).
  #
  # PR-only: the image tag needs github.event.number.
  # ────────────────────────────────────────────────────────────────────────
  build-image:
    runs-on: self-hosted
    timeout-minutes: 90
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        # The self-hosted runner usually has a working stable toolchain. A
        # bare `rustup toolchain install stable` tries to UPDATE it, which
        # can fail with EXDEV on these runners (.rustup/toolchains and
        # .rustup/tmp on different mounts). Install only when genuinely
        # absent; always ensure the wasm target the dx client build needs.
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            if [ -x "$HOME/.cargo/bin/rustup" ]; then
              export PATH="$HOME/.cargo/bin:$PATH"
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              export PATH="$HOME/.cargo/bin:$PATH"
            fi
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain list | grep -q '^stable' || rustup toolchain install stable --profile minimal
          rustup target list --installed | grep -q '^wasm32-unknown-unknown$' || rustup target add wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # no `cache:` input on purpose — restore-only cache policy (see
          # file header): setup-node must not save a cache entry per run.

      - name: Restore cargo registry/index (restore-only)
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # Shared, job-agnostic key so future warm-cache jobs can share it.
          # Restore-only — this workflow never saves (cache-store hygiene,
          # same policy as asset's pr-workflow).
          key: ratel-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ratel-cargo-${{ runner.os }}-

      - name: Restore build target (restore-only)
        uses: actions/cache/restore@v5
        with:
          path: target
          key: ratel-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ratel-target-${{ runner.os }}-

      - name: Install build deps (C toolchain, pkg-config, openssl headers)
        # The web/server dx build needs a linker + pkg-config + openssl dev
        # headers. Idempotent + multi-distro (asset pattern); a no-op once
        # the persistent runner image has them. No webkit/gtk here — those
        # are desktop-target deps the ubuntu-latest jobs install; the
        # web+server platforms don't link them.
        run: |
          set -eu
          if command -v cc >/dev/null 2>&1 && command -v pkg-config >/dev/null 2>&1 && [ -f /usr/include/openssl/ssl.h ]; then
            echo "C toolchain + pkg-config + openssl headers already present"
            exit 0
          fi
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update -qq
            $SUDO apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev
          elif command -v dnf >/dev/null 2>&1; then
            $SUDO dnf install -y gcc make pkgconf-pkg-config openssl-devel
          elif command -v apk >/dev/null 2>&1; then
            $SUDO apk add --no-cache build-base pkgconfig openssl-dev
          else
            echo "::warning::no known package manager; relying on preinstalled toolchain"
          fi

      - name: Install Dioxus-cli (source build — binstall binaries need newer glibc)
        run: |
          # binstall's prebuilt dx targets a newer glibc than the runner image
          # ships (observed: `GLIBC_2.39 not found`), so build from source with
          # `--locked` (honors dioxus-cli's published Cargo.lock — fresh
          # resolution picks git2 0.21 which breaks auth-git2 0.5.8).
          # ~/.cargo/bin persists on the self-hosted runner disk, so the
          # compile is a one-time cost; the version check makes reruns a no-op
          # while still replacing a glibc-broken binary from an earlier run.
          if dx --version >/dev/null 2>&1; then
            echo "working dx already present: $(dx --version)"
          else
            cargo install dioxus-cli --locked --force
          fi

      - name: Build app-shell (native arm64 dx build)
        env:
          # SAME compile-time env block as the ratel-app job — these bake
          # into the binary. The k8s Service names in deploy/pr-preview
          # mirror the compose hostnames, so the baked endpoints stay valid.
          DYNAMO_TABLE_PREFIX: ratel-local
          ENV: local
          RUSTFLAGS: "-D warnings"
          RUST_LOG: error
          DYNAMO_ENDPOINT: http://localstack:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-northeast-2
          AWS_ACCOUNT_ID: test
          COMMIT: pr-${{ github.event.number }}
        run: |
          npm i
          rm -rf target/dx

          cd app/ratel
          make build-testing

      - name: Push app-shell image to the in-cluster registry (buildkit)
        # Packages the dx output with app/ratel/Dockerfile via the in-cluster
        # buildkitd and pushes registry.infra.svc.cluster.local:5000/
        # ratel-app-shell:pr-<num> — the tag the e2e job deploys.
        env:
          NAME: ratel-app-shell
          CONTEXT: target/dx/app-shell/release/web
          DOCKERFILE: app/ratel/Dockerfile
          IMAGE_TAG: pr-${{ github.event.number }}
        run: bash scripts/buildkit-image.sh

  # ────────────────────────────────────────────────────────────────────────
  # e2e: PR-isolated Playwright run on the home k3s cluster — full rationale
  # in the file header. Deploy deploy/pr-preview/*.yaml (localstack +
  # localstack-init + qdrant + qdrant-init + app-shell + Ingress) into
  # namespace ratel-pr-<num>, wait for the stack, run the suite in a k8s pod
  # from the official Playwright image (kubectl cp in / exec / cp out — the
  # runner pods have no docker CLI and no browser OS deps), publish the HTML
  # report to the pr-webroot, then TEAR THE NAMESPACE DOWN — per project
  # policy the preview exists only for the duration of the test run (unlike
  # asset, which keeps it for the PR's lifetime). Only the report webroot
  # (ratel-report-<num>.pr.biyard.co) outlives the run;
  # pr-preview-cleanup.yml removes it on PR close and catches namespaces
  # left behind by cancelled/crashed runs.
  #
  # NON-BLOCKING (`continue-on-error: true`) while the new infra path
  # stabilizes; promote to a required check once green history backs it.
  # pull_request-only — PR_NUM comes from github.event.number.
  # ────────────────────────────────────────────────────────────────────────
  e2e:
    runs-on: self-hosted
    timeout-minutes: 90
    continue-on-error: true # non-blocking introduction — see job comment above
    if: github.event_name == 'pull_request'
    needs: [build-image]
    env:
      # PR number threads through everything: the namespace, the ingress
      # host, the report webroot dir, and the image tag build-image pushed.
      PR_NUM: "${{ github.event.number }}"
      NS: "ratel-pr-${{ github.event.number }}"
      HOST: "ratel-${{ github.event.number }}.pr.biyard.co"

    steps:
      - uses: actions/checkout@v6

      - name: Recreate the per-PR namespace (clean state)
        # Every run starts EMPTY: deleting the previous namespace first
        # guarantees this run's pods pull the freshly pushed :pr-<num>
        # image and that no state (tables, seeds, qdrant collections)
        # leaks between runs. The preview is fully namespace-contained —
        # no shared db to reset (unlike asset).
        run: |
          set -euo pipefail
          kubectl delete namespace "${NS}" --ignore-not-found --wait --timeout=180s || true
          kubectl create namespace "${NS}"

      - name: Create the init-script ConfigMaps
        # The localstack-init / qdrant-init Jobs run the SAME scripts the
        # docker-compose testing profile mounts; here they're delivered as
        # ConfigMaps built from the repo files (≈60 KB total — far under the
        # 1 MB ConfigMap limit).
        run: |
          set -euo pipefail
          kubectl -n "${NS}" create configmap pr-preview-scripts \
            --from-file=scripts/localstack-init-entrypoint.sh \
            --from-file=scripts/dynamodb-schema.json \
            --from-file=scripts/qdrant-init-entrypoint.sh \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "${NS}" create configmap pr-preview-dynamodb-data \
            --from-file=scripts/dynamodb-data/ \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy the preview stack (envsubst → kubectl apply)
        # Plain YAML with ${PR_NUM} placeholders — no helm chart exists in
        # ratel, and the stack is 4 workloads; envsubst keeps it inspectable.
        # The substitution list is restricted to ${PR_NUM} so nothing else
        # in the manifests can be clobbered by runner env. sed fallback in
        # case the runner image lacks gettext's envsubst.
        run: |
          set -euo pipefail
          subst() {
            if command -v envsubst >/dev/null 2>&1; then
              envsubst '${PR_NUM}'
            else
              sed "s|\${PR_NUM}|${PR_NUM}|g"
            fi
          }
          for f in deploy/pr-preview/*.yaml; do
            echo "---"
            subst < "$f"
          done | kubectl apply -f -

      - name: Wait for the stack to answer through ingress-nginx
        # Ordered waits so a failure names its culprit: init Jobs first
        # (table + seeds + qdrant collection), then rollouts (app-shell's
        # initContainer gates on the table, so its rollout implies the init
        # chain), then prove the browser path with curl through the ingress.
        # The PR host rides the ingress default certificate, hence -k;
        # --resolve pins the public name to the controller's ClusterIP (no
        # DNS round-trip, no hairpin dependency).
        run: |
          set -euo pipefail
          kubectl -n "${NS}" wait --for=condition=complete job/localstack-init --timeout=420s
          kubectl -n "${NS}" wait --for=condition=complete job/qdrant-init --timeout=300s
          for d in $(kubectl -n "${NS}" get deploy -o name); do
            echo "── rollout ${d}"
            kubectl -n "${NS}" rollout status "$d" --timeout=420s
          done
          INGRESS_IP=$(kubectl -n infra get svc ingress-nginx-controller -o jsonpath='{.spec.clusterIP}')
          [ -n "$INGRESS_IP" ] || { echo "::error::ingress-nginx-controller service not found"; exit 1; }
          base="https://${HOST}"
          deadline=$(( $(date +%s) + 180 ))
          echo "waiting for ${base}/ (ingress=${INGRESS_IP}) ..."
          until curl -sfk --resolve "${HOST}:443:${INGRESS_IP}" -o /dev/null "${base}/"; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::stack did not answer within 180s after rollout"
              kubectl -n "${NS}" get pods -o wide || true
              exit 1
            fi
            sleep 10
          done
          echo "✓ ingress serves app-shell at ${base}/"

      - name: Run Playwright (k8s pod — official image; runners have no browser deps)
        # The official Playwright image ships chromium + every OS dep for
        # the version pinned in playwright/package-lock.json (1.58.2). The
        # runner cannot bind-mount into a pod, so mirror the old docker-cp
        # flow with kubectl cp: create the pod idle, copy the playwright/
        # tree in, exec the suite, copy report/results back out.
        # E2E_HOST_RESOLVER_RULES pins the PR host to the ingress ClusterIP
        # inside chromium (and playwright.config.js flips ignoreHTTPSErrors
        # on it — the PR host serves the ingress default cert). CI=true +
        # PLAYWRIGHT_TIMEOUT reproduce the old job's retry/worker/timeout
        # config inside the pod.
        run: |
          set -euo pipefail
          INGRESS_IP=$(kubectl -n infra get svc ingress-nginx-controller -o jsonpath='{.spec.clusterIP}')
          [ -n "$INGRESS_IP" ] || { echo "::error::ingress-nginx-controller service not found"; exit 1; }
          pod="playwright"
          kubectl -n "${NS}" delete pod "${pod}" --ignore-not-found --wait=true
          kubectl -n "${NS}" run "${pod}" \
            --image=mcr.microsoft.com/playwright:v1.58.2-noble \
            --restart=Never \
            --env=CI=true \
            --env=PLAYWRIGHT_BASE_URL="https://${HOST}" \
            --env=PLAYWRIGHT_TIMEOUT=60000 \
            --env=E2E_HOST_RESOLVER_RULES="MAP ${HOST} ${INGRESS_IP}" \
            --overrides='{"spec":{"nodeSelector":{"biyard.io/node-class":"main"}}}' \
            --command -- sleep 7200
          kubectl -n "${NS}" wait --for=condition=Ready "pod/${pod}" --timeout=300s
          kubectl -n "${NS}" cp playwright "${pod}:/playwright"
          set +e
          kubectl -n "${NS}" exec "${pod}" -- sh -c 'cd /playwright && npm ci && npx playwright test tests/web'
          ec=$?
          set -e
          kubectl -n "${NS}" cp "${pod}:/playwright/playwright-report" playwright/playwright-report 2>/dev/null || true
          kubectl -n "${NS}" cp "${pod}:/playwright/test-results" playwright/test-results 2>/dev/null || true
          kubectl -n "${NS}" delete pod "${pod}" --wait=false || true
          exit "$ec"

      - name: Dump pod logs (k3s namespace ratel-pr-${{ github.event.number }})
        if: always()
        # Printed INTO THE JOB LOG rather than uploaded: the log is retained
        # with the run at no artifact-storage cost, and the namespace is
        # gone right after this — these lines are the only place the
        # server-side story of a failed run survives.
        run: |
          kubectl -n "${NS}" get pods -o wide 2>&1 || true
          for d in $(kubectl -n "${NS}" get deploy -o name 2>/dev/null); do
            echo "===== ${d} ====="
            kubectl -n "${NS}" logs "$d" --all-containers --tail 400 2>&1 || true
          done
          for j in $(kubectl -n "${NS}" get jobs -o name 2>/dev/null); do
            echo "===== ${j} ====="
            kubectl -n "${NS}" logs "$j" --tail 200 2>&1 || true
          done

      # NOTE: the Playwright report + traces are NOT uploaded as an
      # artifact. The self-contained HTML report is published to the
      # pr-webroot below and stays reachable at
      # ratel-report-<num>.pr.biyard.co until the PR closes (linked from
      # the sticky comment) — an artifact copy would duplicate 100+ MB per
      # run for no extra reviewer value.

      - name: Publish the Playwright report to the pr-webroot
        if: always()
        # The runner pods mount the cluster's `pr-webroot` PVC at
        # /root/nginx — the same volume the infra pr-nginx serves
        # `*.pr.biyard.co` from. `if: always()` — a failing run is exactly
        # when the report matters most. Falls back to a placeholder if none
        # was produced.
        run: |
          set -uo pipefail
          test -d /root/nginx || {
            echo "::error::/root/nginx (pr-webroot mount) is missing on this runner"
            exit 1
          }
          dest="/root/nginx/ratel-report-${PR_NUM}"
          rm -rf "${dest}"
          mkdir -p "${dest}"
          if [ -d playwright/playwright-report ] && [ -n "$(ls -A playwright/playwright-report 2>/dev/null)" ]; then
            cp -a playwright/playwright-report/. "${dest}/"
          else
            echo "<!doctype html><title>no report</title><h1>No Playwright report produced</h1>" > "${dest}/index.html"
          fi

      - name: Tear down the preview namespace
        if: always()
        # Per project policy the preview exists only while the tests run —
        # everything is namespace-contained, so one delete releases the
        # pods, Services, Jobs, ConfigMaps, and the exact-host Ingress (the
        # host falls back to the wildcard pr-nginx). The report webroot
        # published above stays. pr-preview-cleanup.yml is only the safety
        # net for runs that were cancelled/crashed before reaching here
        # (and it removes the report webroot when the PR closes).
        # --wait=false: don't burn runner minutes on finalizers; a repeat
        # run's "Recreate" step waits for full deletion anyway.
        run: kubectl delete namespace "${NS}" --ignore-not-found --wait=false || true

      - name: Sticky PR comment with the report URL
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Update ONE marker-tagged comment in place (no per-run spam). The
        # runner image has no `gh`, so use curl + jq (both present) against
        # the REST API. Comment failures (e.g. a fork PR's read-only token)
        # are non-fatal.
        run: |
          set -uo pipefail
          marker="<!-- e2e-preview -->"
          repo="${{ github.repository }}"
          api="https://api.github.com"
          report="https://ratel-report-${PR_NUM}.pr.biyard.co"
          run_url="https://github.com/${repo}/actions/runs/${{ github.run_id }}"
          body="$(printf '%s\n### 🔎 PR e2e (k3s preview)\n\n- **Playwright report:** %s\n\n<sub>updated by [run](%s) · the preview namespace `ratel-pr-%s` is deployed for the test run and torn down when it finishes; the report stays until this PR closes</sub>\n' \
            "$marker" "$report" "$run_url" "$PR_NUM")"
          payload=$(jq -nc --arg b "$body" '{body:$b}')
          auth="Authorization: Bearer ${GITHUB_TOKEN}"
          acc="Accept: application/vnd.github+json"
          existing=$(curl -sf -H "$auth" -H "$acc" \
            "${api}/repos/${repo}/issues/${PR_NUM}/comments?per_page=100" 2>/dev/null \
            | jq -r --arg m "$marker" 'map(select(.body | startswith($m))) | .[0].id // empty' 2>/dev/null || true)
          if [ -n "${existing}" ]; then
            curl -sf -X PATCH -H "$auth" -H "$acc" \
              "${api}/repos/${repo}/issues/comments/${existing}" -d "$payload" >/dev/null \
              && echo "updated comment ${existing}" || echo "::warning::sticky comment update failed (non-fatal)"
          else
            curl -sf -X POST -H "$auth" -H "$acc" \
              "${api}/repos/${repo}/issues/${PR_NUM}/comments" -d "$payload" >/dev/null \
              && echo "created sticky comment" || echo "::warning::sticky comment create failed (non-fatal)"
          fi

  # ────────────────────────────────────────────────────────────────────────
  # Tauri Android build: produces a debuggable x86_64 APK that the smoke
  # test job below installs on an emulator. The arm64 variant is built by
  # `dev-workflow.yml` for real-device distribution; here we only need
  # x86_64 because GitHub-hosted Linux runners can't accelerate arm64
  # Android emulators.
  # ────────────────────────────────────────────────────────────────────────
  tauri-android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Restore cache
        uses: actions/cache/restore@v5
        with:
          key: tauri-android-build-${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            tauri-android-build-${{ runner.os }}-rust-
          path: |
            ~/.cargo/bin
            target
            app/ratel-tauri/dx-tauri-target

      # Rust toolchain + the two targets the Tauri build needs: wasm32 for
      # the dx-build step (web bundle that gets shipped inside the APK)
      # and x86_64-linux-android for the native Tauri shell that the
      # emulator can actually run.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown,x86_64-linux-android
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Java 21 + Android SDK + NDK — `cargo tauri android build` invokes
      # Gradle which needs all three. `android-actions/setup-android` pulls
      # the SDK; the NDK comes via `ndkmanager` in the same image.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;29.0.14206865"

      - uses: cargo-bins/cargo-binstall@main

      - name: Install dioxus-cli + tauri-cli
        run: |
          # See companion `--locked` notes above: dioxus-cli's source-build
          # fallback otherwise grabs `git2 0.21`, which kills
          # `auth-git2 0.5.8` (`Cred::credential_helper` was removed in
          # the new git2). `--locked` pins to the lockfile shipped with
          # the published crate, which used `git2 0.20`.
          # `--force`: when binstall falls back to a source build (e.g. GitHub
          # 403 rate-limits the prebuilt fetch), it must overwrite the `dx`/
          # `cargo-tauri` binaries restored from cache, else `cargo install`
          # aborts with "binary already exists in destination".
          cargo binstall -y --locked --force dioxus-cli
          cargo binstall -y --locked --force --version "^2.0.0" tauri-cli

      # google-services.json is gitignored (Firebase client config) and absent
      # on a clean checkout, but `make build-android-debug` → `gs-copy` copies
      # it for the google-services Gradle plugin, which fails the build if it's
      # missing. This APK is a smoke-test build that never sends a push, so
      # write a minimal valid placeholder (the plugin only requires the
      # structure + a client whose package_name matches applicationId
      # `co.biyard.ratel`) instead of pulling the real secret — keeps the job
      # working on forks / without secrets.
      - name: Write placeholder google-services.json (smoke build, no push)
        working-directory: app/ratel-tauri
        run: |
          cat > google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ratel-ci-placeholder"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "co.biyard.ratel"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyPLACEHOLDER0000000000000000000000000" }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          echo "Wrote placeholder google-services.json ($(wc -c < google-services.json) bytes)"

      - name: Build x86_64 debug APK
        working-directory: app/ratel-tauri
        env:
          # The smoke-test job below brings up the same `app-shell-testing`
          # docker stack the regular playwright job uses (built with the
          # `bypass` feature so `000000` is accepted as a verification
          # code) and exposes it via `adb reverse tcp:8080 tcp:8080`.
          # Emulator-side `http://localhost:8080` therefore reaches the
          # host docker container.
          #
          # Hosting at `localhost` is critical: the WebView origin is
          # `http://tauri.localhost`, eTLD+1 = `localhost`, same-site
          # with `http://localhost:8080`. That lets the SameSite=Lax
          # session cookie issued by the local backend (ENV=local) ride
          # across the cross-origin fetch.
          MOBILE_API_URL: http://localhost:8080
          ENV: dev
          ANDROID_TARGET: x86_64-linux-android
          # Match dev profile of the workspace; release wasm so the bundle
          # under dist/ is shaped the way real users see it.
          DYNAMO_TABLE_PREFIX: ratel-dev
          RUSTFLAGS: "-D warnings"

          # `commands/google_sign_in.rs` panics at compile time if this
          # is unset. Smoke uses email/password signup so the runtime
          # value doesn't matter — any non-empty string satisfies the
          # compile-time `option_env!().expect()` chain.
          GOOGLE_OAUTH_CLIENT_ID: placeholder-for-compile-only

          # `app/ratel/Makefile`'s BUILD_ENV interpolates these and the
          # default for AWS_ACCOUNT_ID is `$(shell aws sts ...)` which
          # fails without credentials. We don't actually need AWS for the
          # web/tauri-web bundle, so any non-empty value satisfies it.
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-northeast-2
          AWS_ACCOUNT_ID: test
        run: |
          # The setup-android action exports ANDROID_HOME at job scope.
          # Re-point the Makefile's NDK_HOME at the version we just
          # installed (Makefile defaults to /opt/android-ndk which doesn't
          # exist on GH runners).
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export NDK_HOME="$ANDROID_NDK_HOME"
          make dx-build
          make build-android-debug

      - name: Locate APK
        id: locate
        working-directory: app/ratel-tauri
        run: |
          APK=$(find src-tauri/gen/android -name 'app-*-debug.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::no debug APK produced under src-tauri/gen/android"
            find src-tauri/gen/android -name '*.apk' || true
            exit 1
          fi
          echo "apk=$APK" >> $GITHUB_OUTPUT
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: tauri-android-apk-${{ github.sha }}
          path: app/ratel-tauri/${{ steps.locate.outputs.apk }}
          retention-days: 7

      - name: Save cache
        if: always()
        uses: actions/cache/save@v5
        with:
          key: tauri-android-build-${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/bin
            target
            app/ratel-tauri/dx-tauri-target

  # ────────────────────────────────────────────────────────────────────────
  # Tauri Android smoke test: boots an x86_64 Android emulator, brings up
  # the same `app-shell-testing` docker stack the regular playwright job
  # uses (so we get the `bypass` feature for `000000` verification codes
  # against a backend built from this PR's commit), installs the APK from
  # `tauri-android-build`, exposes the WebView's CDP socket via
  # `adb forward`, exposes the host backend inside the emulator via
  # `adb reverse`, and runs the Playwright spec at
  # `playwright/tests/tauri/create-space.spec.js`.
  #
  # Needs `ratel-app` because the APK is built with
  # `MOBILE_API_URL=http://localhost:8080` and we have to stand up that
  # backend somewhere reachable. Pointing at the live dev backend was a
  # dead end — dev has no `bypass`, and any wire-format drift between the
  # PR's tauri-web client and dev's deployed app-shell shows up as opaque
  # 500s.
  # ────────────────────────────────────────────────────────────────────────
  tauri-android-smoke-test:
    runs-on: ubuntu-latest
    needs: [tauri-android-build, ratel-app]
    timeout-minutes: 60

    steps:
      # Default-token checkout like every other job. The repo has no
      # submodules (.gitmodules is empty), and the old
      # `ssh-key: PULL_KEY_REPO` deploy key no longer authenticates
      # (Permission denied on runs 30888104007 + rerun) — it was the only
      # remaining user of that key.
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Required for the Android SDK + emulator that
      # reactivecircus/android-emulator-runner provisions.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # `enable-hw-accel: true` requires KVM. ubuntu-latest doesn't expose
      # /dev/kvm by default, so the action falls back to software
      # emulation — slower but works without extra setup.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: tauri-android-apk-${{ github.sha }}
          path: /tmp/apk

      - name: Locate downloaded APK
        id: apk
        run: |
          APK=$(find /tmp/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::no APK in downloaded artifact"
            ls -la /tmp/apk
            exit 1
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -la "$APK"

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: app-shell-image-${{ github.sha }}
          path: /tmp

      - name: Load Docker image
        run: |
          docker load < /tmp/app-shell-image.tar.gz
          docker images

      - name: Bring up testing infra
        env:
          COMMIT: pr-${{ github.sha }}
          RESET_DB: "true"
        run: |
          docker compose --profile testing up -d localstack qdrant
          echo "Waiting for LocalStack to be healthy..."
          timeout 120 bash -c 'until curl -sf http://localhost:4566/_localstack/health > /dev/null 2>&1; do sleep 5; done'
          echo "LocalStack is healthy, starting remaining services..."
          docker compose --profile testing up -d

      - name: Wait for app-shell
        run: |
          echo "🔄 Checking app-shell..."
          timeout=180
          interval=10
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -f -s http://localhost:8080/ > /dev/null 2>&1; then
              echo "✅ app-shell is responding (took ${elapsed}s)"
              break
            fi
            echo "⏳ app-shell not ready yet... (${elapsed}/${timeout}s)"
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          if [ $elapsed -ge $timeout ]; then
            echo "❌ app-shell failed to respond within ${timeout}s"
            docker compose ps
            docker compose logs app-shell-testing
            exit 1
          fi

      - name: Install Playwright dependencies
        working-directory: playwright
        run: npm i

      # Boot emulator, install APK, set up adb forward (WebView CDP) +
      # adb reverse (emulator→host backend), run the smoke spec. The
      # whole flow lives inside the action's `script:` block so the
      # emulator stays alive for the entire test run.
      - name: Run Tauri smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TAURI_API_BASE: http://localhost:8080
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The action's inline script: feeds each line to a separate
          # `sh -c` invocation, so multi-line for/if/while blocks break.
          # We use a one-line invocation of a script file so the entire
          # smoke test runs in a single bash process.
          script: bash .github/scripts/run-tauri-smoke-test.sh '${{ steps.apk.outputs.path }}'

      - name: Capture app-shell logs
        if: always()
        run: |
          docker compose --profile testing logs app-shell-testing > /tmp/app-shell-testing.log 2>&1 || true
          docker compose --profile testing ps > /tmp/docker-compose-ps.txt 2>&1 || true

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tauri-smoke-artifacts-${{ github.sha }}
          path: |
            playwright/playwright-report/
            playwright/test-results/
            /tmp/tauri-logcat.txt
            /tmp/tauri-devtools-list.json
            /tmp/tauri-devtools-version.json
            /tmp/app-shell-testing.log
            /tmp/docker-compose-ps.txt
          retention-days: 7
